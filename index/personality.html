  <style>
    :root {
      --pink: #d6336c;
      --orange: #f4732a;
      --yellow: #f0b90b;
      --green: #2e9e5b;
      --navy: #3a1f3d;
      --cream: #fff8ec;
      --text-dark: #2b1f2d;
      --text-light: #fff8ec;
    }

    body {
      background-color: #fff4e8;
      background-image: linear-gradient(135deg, #fff4e8 0%, #ffe8d6 100%);
      font-family: 'Georgia', 'Times New Roman', serif;
      color: var(--text-dark);
    }

    .navbar {
      background-color: var(--navy) !important;
    }

    .hero {
      background: linear-gradient(135deg, var(--pink), var(--orange));
      color: var(--text-light);
      padding: 90px 20px;
    }

    .card-box {
      background: white;
      border-radius: 12px;
      padding: 20px;
      margin: 15px 0;
      box-shadow: 0 6px 18px rgba(58, 31, 61, 0.12);
      font-family: 'Georgia', serif;
      color: var(--text-dark);
      border-left: 5px solid var(--green);
    }

    .card-box h3 {
      font-family: 'Trebuchet MS', Helvetica, sans-serif;
      color: var(--pink);
    }

    .tag {
      background-color: var(--green);
      color: var(--text-light);
      padding: 6px 12px;
      border-radius: 20px;
      margin: 4px;
      font-size: 14px;
      display: inline-block;
    }

    .tag:nth-of-type(4n+1) { background-color: var(--pink); }
    .tag:nth-of-type(4n+2) { background-color: var(--orange); }
    .tag:nth-of-type(4n+3) { background-color: var(--yellow); color: var(--text-dark); }
    .tag:nth-of-type(4n+4) { background-color: var(--green); }

    .btn-light {
      background-color: var(--yellow);
      color: var(--navy);
      border: none;
      border-radius: 25px;
      font-family: 'Trebuchet MS', Helvetica, sans-serif;
    }

    .btn-primary {
      background-color: var(--orange);
      border: none;
      border-radius: 25px;
      font-family: 'Trebuchet MS', Helvetica, sans-serif;
    }

    .gallery-carousel {
      max-width: 420px;
      margin: 0 auto;
    }

    .carousel-img {
      width: 100%;
      height: 260px;
      object-fit: cover;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(58, 31, 61, 0.15);
    }

    .gallery-caption {
      font-family: 'Trebuchet MS', Helvetica, sans-serif;
      font-size: 13px;
      text-align: center;
      color: var(--navy);
      margin-top: 8px;
      margin-bottom: 0;
    }

    .carousel-control-prev-icon,
    .carousel-control-next-icon {
      filter: invert(1) grayscale(100);
      background-color: rgba(58, 31, 61, 0.6);
      border-radius: 50%;
      padding: 14px;
    }

    .profile-img {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid var(--cream);
      box-shadow: 0 6px 18px rgba(0,0,0,0.2);
      margin-bottom: 15px;
    }
  </style>
</head>
